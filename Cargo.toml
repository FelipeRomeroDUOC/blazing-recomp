[package]
name = "blazing-recomp"
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Android port of Fire Emblem: The Blazing Blade built on gba-recomp"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gba-core = { git = "https://github.com/JRickey/gba-recomp.git", rev = "de4edf59b872d887046d6a3b005e2df551b6d44c" }
screen = { git = "https://github.com/JRickey/gba-recomp.git", rev = "de4edf59b872d887046d6a3b005e2df551b6d44c" }
log = "0.4"
raw-window-handle = "0.6"
jni = "0.22"
wgpu = "26"
bytemuck = "1"
pollster = "0.4"
fontdue = "0.9"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
