[package]
name = "blazing-recomp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Android port of Fire Emblem: The Blazing Blade built on gba-recomp"

[lib]
crate-type = ["cdylib"]

[dependencies]
gba-core = { path = "../gba-recomp/crates/gba-core" }
screen = { path = "../gba-recomp/crates/screen" }
log = "0.4"
raw-window-handle = "0.6"
jni = "0.22"
wgpu = "26"
bytemuck = "1"
pollster = "0.4"

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
