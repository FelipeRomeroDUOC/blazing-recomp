[package]
name = "blazing-recomp"
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Android port of Fire Emblem: The Blazing Blade built on gba-recomp"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gba-core = { git = "https://github.com/JRickey/gba-recomp.git", rev = "de4edf59b872d887046d6a3b005e2df551b6d44c", features = ["perf-counters"] }
screen = { git = "https://github.com/JRickey/gba-recomp.git", rev = "de4edf59b872d887046d6a3b005e2df551b6d44c" }
log = "0.4"
raw-window-handle = "0.6"
jni = "0.22"
wgpu = "26"
bytemuck = "1"
pollster = "0.4"
fontdue = "0.9"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[patch."https://github.com/JRickey/gba-recomp.git"]
gba-core = { path = "../gba-recomp/crates/gba-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[[bin]]
name = "ppu_doble"
path = "src/bin/ppu_doble.rs"
required-features = ["proto"]

[features]
proto = ["gba-core/perf-video"]

[[example]]
name = "ppu_capas"
required-features = ["proto"]

[[example]]
name = "ppu_estado"
required-features = ["proto"]

[[example]]
name = "ppu_linea"
required-features = ["proto"]

[[example]]
name = "ppu_capas_linea"
required-features = ["proto"]

[[example]]
name = "ppu_efectos_ventanas"
required-features = ["proto"]

[[example]]
name = "ppu_pixeles_obj"
required-features = ["proto"]

[[example]]
name = "ppu_contenido_bg"
required-features = ["proto"]

[[example]]
name = "ppu_subcamino"
required-features = ["proto"]

[[example]]
name = "ppu_afin_y_linea"
required-features = ["proto"]

[[example]]
name = "ppu_camino_general"
required-features = ["proto"]

[[example]]
name = "ppu_tiempos"
required-features = ["proto"]

[[example]]
name = "ppu_capa_ganadora"
required-features = ["proto"]

[[example]]
name = "ppu_nativa_compara"
required-features = ["proto"]

[[example]]
name = "ppu_nativa_afin"
required-features = ["proto"]

# Estos tres ejemplos no estaban declarados y los construía el descubrimiento
# automático de Cargo, sin `required-features`. `ppu_banda_nativa` usa
# `gba_core::ppu::forzar_camino_general`, que solo existe con la feature
# `perf-video` del motor base: al declararlo con `proto`, `cargo test` deja de
# fallar al compilarlo. Los otros dos no necesitan la feature, así que se
# declaran sin ella para que la suite siga compilándolos.
[[example]]
name = "ppu_banda_nativa"
required-features = ["proto"]

[[example]]
name = "ppu_barrido_nativa"

[[example]]
name = "ppu_nativa_atribuye"
required-features = ["proto"]

[[example]]
name = "ppu_modo_cuadro"
